name: Release

# Builds the portable ZIP and the installer, then attaches them to a GitHub Release
# whenever a version tag (v1.2.3) is pushed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build portable package
        shell: pwsh
        run: ./build/publish.ps1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./build/make-installer.ps1

      - name: Run tests
        run: dotnet test AniVault.slnx -c Release --nologo

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anivault-dist
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
